services:
  - type: web
    name: apartcheck-heykay-47
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -w server
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
